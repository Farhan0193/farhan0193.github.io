<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search | LuminaVubon</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<div class="container">

<div class="topbar">

<a href="index.html" class="logo">
LuminaVubon🌐
</a>

<button class="menu-btn" onclick="toggleMenu()">
☰
</button>

</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search..."

>

<button id="searchBtn">

🔍

</button>

</div>

<nav class="navbar" id="navbar">

<a href="index.html">Home</a>
<a href="news.html">News</a>
<a href="technology.html">Technology</a>
<a href="ai-tools.html">AI Tools</a>
<a href="health.html">Health</a>
<a href="food.html">Food</a>
<a href="lifestyle.html">Lifestyle</a>
<a href="earning-tips.html">Earning Tips</a>

</nav>

</div>

</header>

<section class="featured">

<div class="container">

<h2>🔍 Search Results</h2>

<div id="results" class="cards"></div>

</div>

</section>

<script>

const pages=[

{name:"News",url:"news.html",keys:["news","headline"]},

{name:"Technology",url:"technology.html",keys:["technology","tech"]},

{name:"AI Tools",url:"ai-tools.html",keys:["ai","chatgpt","gemini"]},

{name:"Health",url:"health.html",keys:["health","fitness"]},

{name:"Food",url:"food.html",keys:["food","recipe"]},

{name:"Lifestyle",url:"lifestyle.html",keys:["lifestyle"]},

{name:"Earning Tips",url:"earning-tips.html",keys:["earning","affiliate","freelancing"]},

{name:"BBC News",url:"https://www.bbc.com/news",keys:["bbc"]},

{name:"Reuters",url:"https://www.reuters.com",keys:["reuters"]},

{name:"CNN",url:"https://edition.cnn.com",keys:["cnn"]},

{name:"ChatGPT",url:"https://chatgpt.com",keys:["chatgpt","openai"]},

{name:"Google Gemini",url:"https://gemini.google.com",keys:["gemini"]},

{name:"Fiverr",url:"https://www.fiverr.com",keys:["fiverr"]},

{name:"Upwork",url:"https://www.upwork.com",keys:["upwork"]},

{name:"Adsterra",url:"https://adsterra.com",keys:["adsterra"]},

{name:"AdCombo",url:"https://adcombo.com",keys:["adcombo"]}

];const results=document.getElementById("results");

function runSearch(){

const params=new URLSearchParams(window.location.search);

const urlQuery=params.get("query");

const keyword=(urlQuery||document.getElementById("searchInput").value)
.toLowerCase().trim();

if(document.getElementById("searchInput")){
document.getElementById("searchInput").value=keyword;
}

results.innerHTML="";

if(keyword===""){
results.innerHTML="<div class='card'><h3>Search something...</h3></div>";
return;
}

let found=false;

pages.forEach(item=>{

if(item.keys.some(k=>keyword.includes(k)||k.includes(keyword))){

found=true;

results.innerHTML+=`
<div class="card">
<h3>${item.name}</h3>
<p>Open this page or website.</p>
<a href="${item.url}" target="_blank">Open →</a>
</div>
`;

}

});

if(!found){

results.innerHTML=`
<div class="card">
<h3>❌ No Results Found</h3>
<p>Try another keyword.</p>
</div>
`;

}

}

document.getElementById("searchBtn").addEventListener("click",function(){

const value=document.getElementById("searchInput").value.trim();

window.location.href="search.html?query="+encodeURIComponent(value);

});

document.getElementById("searchInput").addEventListener("keydown",function(e){

if(e.key==="Enter"){

const value=this.value.trim();

window.location.href="search.html?query="+encodeURIComponent(value);

}

});

runSearch();

</script>

<script src="script.js"></script>

</body>

</html>
